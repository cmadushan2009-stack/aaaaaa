<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Optimized Futuristic RC Car Control</title>
    <style>
        :root {
            --primary-glow: #00f2fe;
            --neon-blue: #00d2ff;
            --neon-red: #ff0055;
            --neon-orange: #ff9900;
            --neon-purple: #b624ff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.07);
            --panel-bg: rgba(6, 10, 26, 0.9);
        }

        body {
            background: radial-gradient(circle at center, #0f1026, #050510, #000000);
            color: #ffffff;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 10px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
            position: relative;
            transition: background 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (min-width: 768px) {
            body {
                padding: 20px 40px;
                overflow: hidden;
            }
        }

        body.nitro-active {
            background: radial-gradient(circle at center, #3a0010, #100005, #000000);
            animation: pulseBg 1s infinite alternate;
        }

        @keyframes pulseBg {
            0% { background-color: #000000; }
            100% { background-color: #120004; }
        }

        /* 📊 Top Status Bar - Mobile Optimized */
        .top-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 15, 30, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            padding: 6px 12px; /* උස සහ ඉඩ අඩු කළා */
            border-radius: 14px;
            font-size: 11px; /* අකුරු පොඩි කළා */
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 10;
            margin-bottom: 10px;
        }

        @media (min-width: 768px) {
            .top-status {
                padding: 12px 20px;
                font-size: 13px;
                border-radius: 20px;
            }
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--glass-bg);
            padding: 4px 8px; /* ස්ටේටස් බොක්ස් කුඩා කළා */
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            font-weight: 500;
        }

        @media (min-width: 768px) {
            .status-item {
                gap: 6px;
                padding: 6px 12px;
            }
        }

        .bulb-status-box, .rgb-status-box, .horn-status-box {
            display: none;
            align-items: center;
            gap: 4px;
            animation: pulseGlow 1.5s infinite alternate;
        }

        /* 🌐 WS Connection Badge */
        .ws-status-badge {
            font-size: 9px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 20px;
            background: rgba(255, 0, 85, 0.15);
            color: var(--neon-red);
            border: 1px solid rgba(255, 0, 85, 0.3);
        }

        .ws-connected {
            background: rgba(0, 242, 254, 0.15);
            color: var(--primary-glow);
            border: 1px solid rgba(0, 242, 254, 0.3);
        }

        .status-gear {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            padding: 2px;
        }

        @media (min-width: 768px) {
            .status-gear {
                font-size: 24px;
                padding: 4px;
            }
        }

        /* ⚙️ Settings Panel */
        .settings-dropdown-panel {
            position: absolute;
            top: 55px; 
            right: 10px; 
            display: flex;
            flex-direction: column; 
            gap: 12px; 
            background: var(--panel-bg);
            padding: 15px; 
            border-radius: 16px; 
            border: 1px solid rgba(0, 242, 254, 0.25);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            opacity: 0;
            transform: translateY(-15px) scale(0.95); 
            pointer-events: none;
            transition: all 0.3s ease;
            width: 190px; 
            z-index: 100;
        }

        @media (min-width: 768px) {
            .settings-dropdown-panel {
                top: 85px;
                right: 40px;
                width: 240px;
                padding: 20px;
            }
        }

        .settings-dropdown-panel.show-panel {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .panel-label {
            font-size: 9px; 
            font-weight: 800; 
            letter-spacing: 0.5px;
        }

        .horizontal-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            outline: none;
        }

        .horizontal-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary-glow);
            cursor: pointer;
            border: 1px solid #ffffff;
        }

        .color-picker-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .advanced-picker {
            -webkit-appearance: none;
            appearance: none;
            width: 45px;
            height: 26px;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .advanced-picker::-webkit-color-swatch {
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .settings-fs-btn {
            background: rgba(0, 242, 254, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: var(--primary-glow);
            padding: 8px;
            border-radius: 10px;
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 🎨 Game Controls Layout */
        .game-controls {
            display: flex;
            flex-direction: column; 
            gap: 20px;
            flex: 1;
            padding: 5px 0;
            z-index: 1;
            justify-content: center;
        }

        @media (orientation: landscape) or (min-width: 768px) {
            .game-controls {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                gap: 0;
            }
        }

        .left-controls-group, .right-controls-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .slider-container-vertical {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 130px; /* උස අඩු කළා */
            width: 48px;  /* පළල අඩු කළා */
            background: rgba(5, 5, 15, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 25px; 
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.6);
        }

        @media (min-width: 768px) {
            .slider-container-vertical {
                height: 180px;
                width: 60px;
            }
        }

        .slider-container-horizontal {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 48px; 
            width: 170px; 
            background: rgba(5, 5, 15, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 25px; 
            padding: 0 10px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.6);
        }

        @media (min-width: 768px) {
            .slider-container-horizontal {
                height: 60px;
                width: 210px;
            }
        }

        .vertical-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 35px; 
            background: transparent; 
            transform: rotate(-90deg);
            outline: none;
            cursor: pointer;
        }

        @media (min-width: 768px) {
            .vertical-slider {
                width: 150px;
                height: 40px;
            }
        }

        .horizontal-steer-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 35px;
            background: transparent;
            outline: none;
            cursor: pointer;
        }

        .vertical-slider::-webkit-slider-thumb, 
        .horizontal-steer-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 34px; /* Slider Knob එක පොඩි කළා */
            height: 34px;
            border-radius: 50%; 
            background: radial-gradient(circle at 35% 35%, #ffffff, var(--primary-glow));
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.6);
            border: 1.5px solid rgba(255,255,255,0.8);
        }

        @media (min-width: 768px) {
            .vertical-slider::-webkit-slider-thumb, 
            .horizontal-steer-slider::-webkit-slider-thumb {
                width: 44px;
                height: 44px;
            }
        }

        .top-row-pad {
            display: flex;
            gap: 12px; 
        }

        /* 📱 Mobile Optimized Buttons (කුඩා කරන ලද බටන්ස්) */
        .glass-btn {
            background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
            border: 1px solid var(--glass-border);
            color: rgba(255, 255, 255, 0.7);
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            touch-action: none; 
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .horn-btn, .park-btn, .light-main-btn, .rgb-toggle-btn {
            width: 46px; /* 62px සිට 46px දක්වා පොඩි කළා */
            height: 46px;
            border-radius: 50%;
            font-size: 16px; /* ඉමෝජි ප්‍රමාණය කුඩා කළා */
        }

        @media (min-width: 768px) {
            .horn-btn, .park-btn, .light-main-btn, .rgb-toggle-btn {
                width: 62px;
                height: 62px;
                font-size: 24px;
            }
        }

        .horn-btn { color: var(--neon-blue); border-color: rgba(0, 210, 255, 0.2); }
        .horn-btn.active {
            background: linear-gradient(135deg, #00f2fe, #00d2ff) !important;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.6) !important;
            color: #000;
        }

        .nitro-btn {
            font-size: 24px;
            width: 60px; /* 84px සිට 60px දක්වා පොඩි කළා */
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 0, 85, 0.02);
            border-color: rgba(255, 0, 85, 0.15);
            color: var(--neon-red);
        }

        @media (min-width: 768px) {
            .nitro-btn {
                width: 84px;
                height: 84px;
                font-size: 34px;
            }
        }

        .nitro-btn.active {
            background: linear-gradient(135deg, #ff0055, #ff5e00) !important;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.7) !important;
            color: #fff;
        }

        .park-btn {
            background: rgba(255, 153, 0, 0.02);
            border-color: rgba(255, 153, 0, 0.15);
            color: var(--neon-orange);
        }

        .park-active {
            background: linear-gradient(135deg, #ff9900, #ff5500) !important;
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.6) !important;
            color: #fff;
        }

        .light-main-btn {
            color: #ffe600;
            border-color: rgba(255, 230, 0, 0.15);
        }

        .light-active {
            background: linear-gradient(135deg, #ffe600, #ff9900) !important;
            box-shadow: 0 0 15px rgba(255, 230, 0, 0.6) !important;
            color: #000;
        }

        .rgb-toggle-btn {
            color: var(--neon-purple);
            border-color: rgba(182, 36, 255, 0.15);
        }

        .rgb-active {
            background: linear-gradient(135deg, #b624ff, #8000ff) !important;
            box-shadow: 0 0 15px rgba(182, 36, 255, 0.6) !important;
            color: #fff;
        }

        .glass-btn:active:not(.active) { transform: scale(0.92); }
        .glass-btn.active { transform: scale(0.92); }
    </style>
</head>
<body id="main-bg">

    <div class="top-status">
        <div class="status-left">
            <div id="sys-mode-display" style="font-weight: 800; color: rgba(255,255,255,0.9); letter-spacing: 1px;">🎮 CYBER RC</div>
            <div class="status-item"><span id="ws-status" class="ws-status-badge">DISCONNECTED</span></div>
            <div class="status-item"><span>🌡️</span> <span id="temp-display" style="color:var(--neon-orange); font-weight:bold;">34°C</span></div>
            <div class="status-item"><span id="bat-icon">🔋</span> <span id="bat-display" style="color:var(--primary-glow); font-weight:bold;">85%</span></div>
            <div class="status-item horn-status-box" id="horn-alert-container"><span>🔊</span> <span style="color: var(--primary-glow); font-weight:bold;">HORN</span></div>
            
            <div class="status-item bulb-status-box" id="bulb-container"><span>💡</span> <span id="led-display" style="color: #ffe600; font-weight:bold;">LED: 100%</span></div>
            
            <div class="status-item rgb-status-box" id="rgb-container"><span>✨</span> <span id="rgb-display" style="color: var(--neon-purple); font-weight:bold;">RGB ON</span></div>
            
            <div class="status-item"><span style="color: rgba(255,255,255,0.4); font-size:9px; font-weight: bold;">SPD:</span> <span id="speed-display" style="color: var(--primary-glow); font-weight:bold; min-width:25px;">0%</span></div>
            <div class="status-item"><span style="color: rgba(255,255,255,0.4); font-size:9px; font-weight: bold;">STR:</span> <span id="steer-display" style="color: var(--primary-glow); font-weight:bold; min-width:25px;">0%</span></div>
        </div>
        
        <div class="status-gear" id="gear-btn">⚙️</div>
    </div>

    <div class="settings-dropdown-panel" id="settings-panel">
        <div style="display: flex; flex-direction: column; gap: 6px;">
            <div class="panel-label" style="color: #ffe600;">☀️ HEADLIGHT BRIGHTNESS</div>
            <input type="range" min="0" max="100" value="100" class="horizontal-slider" id="headlight-slider" oninput="updateHeadlightBrightness(this.value)">
        </div>

        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.06); margin: 4px 0;">

        <div class="color-picker-row">
            <div class="panel-label" style="color: var(--neon-purple);">✨ CAR RGB COLOR</div>
            <input type="color" id="adv-color-picker" class="advanced-picker" value="#ffffff" oninput="pickCarColor(this.value)">
        </div>

        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.06); margin: 4px 0;">
        
        <div class="settings-fs-btn" onclick="toggleFullScreen()">🖥️ FULLSCREEN MODE</div>
    </div>

    <div class="game-controls">
        
        <div class="left-controls-group">
            <div class="glass-btn nitro-btn" id="btn-nitro">🔥</div>
            <div class="slider-container-vertical">
                <input type="range" min="-100" max="100" value="0" class="vertical-slider" id="throttle-slider" oninput="updateSlider(this.value)">
            </div>
        </div>
        
        <div class="right-controls-group">
            <div class="top-row-pad">
                <div class="glass-btn horn-btn" id="btn-horn">🔊</div>
                <div class="glass-btn park-btn" id="btn-park">🛑</div>
            </div>

            <div class="top-row-pad">
                <div class="glass-btn light-main-btn" id="light-btn">🔅</div>
                <div class="glass-btn rgb-toggle-btn" id="rgb-toggle-btn">✨</div>
            </div>

            <div class="slider-container-horizontal">
                <input type="range" min="-100" max="100" value="0" class="horizontal-steer-slider" id="steer-slider" oninput="updateSteerSlider(this.value)">
            </div>
        </div>

    </div>

    <script>
        const slider = document.getElementById('throttle-slider');
        const steerSlider = document.getElementById('steer-slider');
        const speedDisplay = document.getElementById('speed-display');
        const steerDisplay = document.getElementById('steer-display');
        const sysModeDisplay = document.getElementById('sys-mode-display');
        
        const gearBtn = document.getElementById('gear-btn');
        const settingsPanel = document.getElementById('settings-panel');
        const rgbToggleBtn = document.getElementById('rgb-toggle-btn');
        const wsStatusBadge = document.getElementById('ws-status');
        const headlightSlider = document.getElementById('headlight-slider');
        
        let isLightOn = false;
        let isParkMode = false; 
        let isRGBOn = false;
        let savedHexColor = "FFFFFF"; 
        let headlightBrightnessValue = 100; 

        const bulbContainer = document.getElementById('bulb-container');
        const ledDisplay = document.getElementById('led-display');
        const rgbContainer = document.getElementById('rgb-container');
        const hornAlertContainer = document.getElementById('horn-alert-container'); 
        const lightBtn = document.getElementById('light-btn');
        const bodyBg = document.getElementById('main-bg');

        // 🌐 WebSocket Connection
        let ws;
        function initWebSocket() {
            let wsGateway = `ws://${window.location.hostname}/ws`;
            if(window.location.hostname === "") {
                wsGateway = "ws://192.168.4.1/ws"; 
            }
            ws = new WebSocket(wsGateway);

            ws.onopen = function() {
                wsStatusBadge.innerText = "LIVE CONNECTED";
                wsStatusBadge.classList.add('ws-connected');
            };
            ws.onclose = function() {
                wsStatusBadge.innerText = "DISCONNECTED";
                wsStatusBadge.classList.remove('ws-connected');
                setTimeout(initWebSocket, 2000); 
            };
        }

        function sendCmd(cmd) {
            console.log("Sent: " + cmd);
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(cmd);
            }
        }

        function syncTopStatusUI() {
            if (isLightOn && headlightBrightnessValue > 0) {
                bulbContainer.style.display = "flex";
                ledDisplay.innerText = "LED: " + headlightBrightnessValue + "%";
            } else {
                bulbContainer.style.display = "none";
            }

            if (isRGBOn) {
                rgbContainer.style.display = "flex";
            } else {
                rgbContainer.style.display = "none";
            }
        }

        function updateHeadlightBrightness(val) {
            headlightBrightnessValue = val;
            sendCmd("HEADLIGHT_" + val); 
            
            if(val == 0) {
                lightBtn.classList.remove('light-active');
                isLightOn = false;
            } else {
                lightBtn.classList.add('light-active');
                isLightOn = true;
            }
            syncTopStatusUI();
        }

        function pickCarColor(hexColor) {
            savedHexColor = hexColor.replace("#", "").toUpperCase();
            isRGBOn = true;
            rgbToggleBtn.classList.add('rgb-active');
            sendCmd("RGB_" + savedHexColor);
            syncTopStatusUI();
        }

        setupSensitiveButton('rgb-toggle-btn', () => {
            isRGBOn = !isRGBOn;
            if(isRGBOn) {
                rgbToggleBtn.classList.add('rgb-active');
                sendCmd("RGB_" + savedHexColor); 
            } else {
                rgbToggleBtn.classList.remove('rgb-active');
                sendCmd("RGB_OFF");
            }
            syncTopStatusUI();
        }, null, true);

        setupSensitiveButton('light-btn', () => {
            isLightOn = !isLightOn;
            if(isLightOn) {
                lightBtn.classList.add('light-active');
                headlightBrightnessValue = 100;
                headlightSlider.value = 100;
                sendCmd("HEADLIGHT_100");
            } else {
                lightBtn.classList.remove('light-active');
                headlightBrightnessValue = 0;
                headlightSlider.value = 0;
                sendCmd("HEADLIGHT_0");
            }
            syncTopStatusUI();
        }, null, true);

        gearBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsPanel.classList.toggle('show-panel');
        });

        document.addEventListener('click', (e) => {
            if (!settingsPanel.contains(e.target) && e.target !== gearBtn) {
                settingsPanel.classList.remove('show-panel');
            }
        });

        document.addEventListener('touchstart', (e) => {
            if (!settingsPanel.contains(e.target) && e.target !== gearBtn) {
                settingsPanel.classList.remove('show-panel');
            }
        });

        function toggleFullScreen() {
            let doc = window.document;
            let docEl = doc.documentElement;
            let requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                if (requestFullScreen) requestFullScreen.call(docEl);
            } else {
                let cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;
                if (cancelFullScreen) cancelFullScreen.call(doc);
            }
            settingsPanel.classList.remove('show-panel');
        }

        function setupSensitiveButton(id, startCallback, endCallback, isToggle = false) {
            let btn = document.getElementById(id);
            if(!btn) return;
            
            const handleStart = (e) => {
                if(e) e.preventDefault();
                if(!isToggle) btn.classList.add('active');
                if(startCallback) startCallback();
            };

            const handleEnd = (e) => {
                if(e) e.preventDefault();
                if(!isToggle) btn.classList.remove('active');
                if(endCallback) endCallback();
            };

            btn.addEventListener('touchstart', handleStart);
            btn.addEventListener('touchend', handleEnd);
            btn.addEventListener('mousedown', handleStart);
            btn.addEventListener('mouseup', handleEnd);
            btn.addEventListener('mouseleave', () => { if(!isToggle) btn.classList.remove('active'); });
            btn.addEventListener('contextmenu', e => e.preventDefault());
        }

        setupSensitiveButton('btn-nitro', () => {
            if(isParkMode) return;
            bodyBg.classList.add('nitro-active');
            speedDisplay.innerText = "100%";
            slider.value = 100;
            sendCmd('SPEED_100');
            sendCmd('N_ON');
        }, () => {
            if(isParkMode) return;
            bodyBg.classList.remove('nitro-active');
            resetSlider();
            sendCmd('N_OFF');
        });

        setupSensitiveButton('btn-horn', () => {
            hornAlertContainer.style.display = "flex";
            sendCmd('HORN_ON');
        }, () => {
            hornAlertContainer.style.display = "none";
            sendCmd('HORN_OFF');
        });

        setupSensitiveButton('btn-park', () => {
            isParkMode = !isParkMode;
            let parkBtn = document.getElementById('btn-park');
            if(isParkMode) {
                parkBtn.classList.add('park-active');
                sysModeDisplay.innerText = "🛑 PARKED";
                sysModeDisplay.style.color = "var(--neon-red)";
                resetSlider(); resetSteerSlider();
                sendCmd('PARK_ON');
            } else {
                parkBtn.classList.remove('park-active');
                sysModeDisplay.innerText = "🎮 CYBER RC";
                sysModeDisplay.style.color = "rgba(255,255,255,0.9)";
                sendCmd('PARK_OFF');
            }
        }, null, true);

        function updateSlider(val) {
            if(isParkMode) { slider.value = 0; speedDisplay.innerText = "0%"; return; }
            speedDisplay.innerText = val + "%";
            sendCmd("SPEED_" + val);
        }

        function resetSlider() {
            slider.value = 0; speedDisplay.innerText = "0%";
            sendCmd("SPEED_0");
        }

        slider.addEventListener('touchend', resetSlider);
        slider.addEventListener('mouseup', resetSlider);

        function updateSteerSlider(val) {
            if(isParkMode) { steerSlider.value = 0; steerDisplay.innerText = "0%"; return; }
            steerDisplay.innerText = val + "%";
            sendCmd("STEER_" + val);
        }

        function resetSteerSlider() {
            steerSlider.value = 0; steerDisplay.innerText = "0%";
            sendCmd("STEER_0");
        }

        steerSlider.addEventListener('touchend', resetSteerSlider);
        steerSlider.addEventListener('mouseup', resetSteerSlider);

        window.onload = initWebSocket;
    </script>
</body>
</html>
